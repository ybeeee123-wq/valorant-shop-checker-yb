<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check your daily VALORANT store without opening the game." />
    <meta property="og:title" content="VALSHOP — Your personal VALORANT storefront" />
    <meta property="og:description" content="Check your daily VALORANT store without opening the game." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f4f4f0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VALSHOP" />
    <script>
      try {
        const theme = localStorage.getItem('valshop-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#111311' : '#f4f4f0');
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://media.valorant-api.com" />
    <link rel="preconnect" href="https://valorant-shop-checker-yb-production.up.railway.app" crossorigin />
    <link rel="dns-prefetch" href="https://valorant.dyn.riotcdn.net" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>VALSHOP — Daily Store Checker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
