[project]
name = "valshop-companion"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27", "keyring>=25.5", "pydantic-settings>=2.6",
  "PySide6>=6.8,<7", "platformdirs>=4.3", "packaging>=24.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pyinstaller>=6.11", "pillow>=11.0"]

[project.scripts]
valshop-companion = "launcher:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "launcher", "callback", "cloud_client", "config", "credentials", "desktop",
  "local_riot", "local_store", "logging_setup", "pairing", "paths",
  "preferences", "riot_client", "scheduler", "startup", "state", "version",
]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}
